font_family GeistMono NFM
font_size 12

# Shell integration is sourced and configured manually
shell_integration no-rc

# --- Theme generated by theme-switch (matugen) ---
foreground #f2d2d2
background #0d0707
selection_background #e51111
selection_foreground #ffffff
cursor #e51111
cursor_text_color #ffffff
active_border_color #9d0a12
inactive_border_color #8a5a5a
url_color #ff4b4b
color0 #0d0707
color1 #a00a0a
color2 #ff4b4b
color3 #ff5555
color4 #5a0c0c
color5 #3a1111
color6 #e51111
color7 #f2d2d2
color8 #2a1414
color9 #a00a0a
color10 #ff4b4b
color11 #ff5555
color12 #e51111
color13 #a00a0a
color14 #e51111
color15 #f2d2d2

confirm_os_window_close 0
enable_audio_bell no
background_opacity 0.82
background_blur 20
window_padding_width 15
mouse_hide_wait 3.0
allow_remote_control yes
